name: displaylink
type: shell
commands:
  - apt-get install -y dkms linux-headers-amd64 evdi-dkms libdrm2 libdrm-dev libelf-dev libssl-dev

  # Get the Debian kernel version from installed headers (not the Azure host kernel)
  - KVER=$(ls /lib/modules/ | grep -v azure | sort -V | tail -1) && echo "Target kernel is $KVER"

  # Create a fake uname so the installer sees the Debian kernel, not the Azure runner kernel
  - |
    KVER=$(ls /lib/modules/ | grep -v azure | sort -V | tail -1) 
    cat > /usr/local/bin/uname << EOF
    #!/bin/sh
    if [ "\$1" = "-r" ]; then
        echo "$KVER"
    else
        /bin/uname "\$@"
    fi
    EOF
    chmod +x /usr/local/bin/uname

  # Extract and run the installer — it will now see the correct kernel version
  - chmod +x /opt/displaylink-driver.run
  - /opt/displaylink-driver.run --nox11 --noexec --target /opt/displaylink-extract
  - PATH=/usr/local/bin:$PATH SYSTEMINITDAEMON=systemd bash /opt/displaylink-extract/displaylink-installer.sh

  # Remove the fake uname — job done
  - rm -f /usr/local/bin/uname

  - systemctl enable displaylink-driver
  - rm -rf /opt/displaylink-extract /opt/displaylink-driver.run
  - apt-get clean